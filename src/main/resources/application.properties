spring.application.name=cadres-bcs-compass
server.port=${PORT:8080}

# যদি Render-এ আপনার আসল MySQL/PostgreSQL URL দেওয়া থাকে তবে সেটি নিবে, নাহলে ডিস্ক ফাইলে পার্মানেন্টলি সেভ রাখবে
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/cbcdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
