spring.application.name=cadres-bcs-compass
server.port=8080

# File-based H2 database to permanently prevent 'database is empty' errors
spring.datasource.url=jdbc:h2:file:./data/cadresdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Settings to guarantee table creation
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
