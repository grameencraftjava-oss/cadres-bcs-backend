spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cadres_bcs_compass}
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-className: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
